# 베타 테스터 칭호 주기 — 비공개 테스트가 끝날 때 한 번만 손으로 돌린다
#
# GitHub 저장소 → Actions → "베타 테스터 칭호 주기" → Run workflow
#   until:   이 날(한국 시간)까지 기록을 올린 사람에게 준다. 비우면 지금까지 전부
#   dry_run: 켜면 누가 받을지 목록만 보여 주고 실제로 주지 않는다 → 먼저 이걸로 확인
#
# ⚠️ 정식 출시한 다음에는 절대 돌리지 말 것. 일반 이용자까지 테스터 칭호를 받는다.
name: 베타 테스터 칭호 주기

on:
  workflow_dispatch:
    inputs:
      until:
        description: "이 날까지 기록을 올린 사람 (예: 2026-10-31, 비우면 지금까지)"
        required: false
      dry_run:
        description: "목록만 보기 (실제로 주지 않음)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  award:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 구글 클라우드 로그인 (키 없는 연동)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/204724489972/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions@either-or-130af.iam.gserviceaccount.com
      - name: 도구 설치
        run: |
          mkdir -p /tmp/fb && cd /tmp/fb && npm init -y > /dev/null
          npm install --no-audit --no-fund @google-cloud/firestore@7 google-auth-library@9
          ln -s /tmp/fb/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: 칭호 주기
        env:
          UNTIL: ${{ inputs.until }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -o pipefail
          node tools/award-tester.mjs 2> err.txt | tee out.txt || { echo "::error::칭호 주기 실패: $(tr '\n' ' ' < err.txt | cut -c1-3000)"; exit 1; }
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
